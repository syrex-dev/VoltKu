name: Build VoltKu Android APK

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'frontend/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Opsional: URL default server backend VoltKu untuk .apk (contoh: https://voltku.synemax.web.id)'
        required: false
        default: 'https://voltku.synemax.web.id'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java 21 (untuk Gradle & AGP 8.13)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle & Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Siapkan Android Debug Keystore persisten (agar SHA-1 Google Sign-In stabil)
        uses: actions/cache@v4
        with:
          path: /home/runner/.android/debug.keystore
          key: voltku-android-debug-keystore-v2

      - name: Pulihkan keystore dari Secret (opsional)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            KS_FILE="${{ runner.temp }}/voltku-debug.keystore"
            mkdir -p "$HOME/.android"
            printf '%s' "$ANDROID_KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$KS_FILE"
            cp "$KS_FILE" "$HOME/.android/debug.keystore"
            echo "VOLTKU_DEBUG_KEYSTORE=$KS_FILE" >> "$GITHUB_ENV"
            echo "Keystore permanen dari Secret ANDROID_DEBUG_KEYSTORE_BASE64 aktif."
          fi

      - name: Pasang google-services.json dari Secret (opsional untuk Push FCM)
        env:
          GOOGLE_SERVICES_JSON_RAW: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_RAW" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON_RAW" > frontend/android/app/google-services.json
            echo "google-services.json aktif untuk FCM Push Instan."
          fi

      - name: Install dependencies frontend
        working-directory: frontend
        run: npm ci

      - name: Lint & build frontend VoltKu
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ github.event.inputs.api_base_url || 'https://voltku.synemax.web.id' }}
        run: |
          npm run lint
          npm run build
          npx cap sync android

      - name: Beri izin eksekusi Gradle wrapper
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Debug APK (siap instal langsung di HP Android)
        working-directory: frontend/android
        env:
          VOLTKU_VERSION_CODE: ${{ github.run_number }}
          VOLTKU_VERSION_NAME: "1.0.${{ github.run_number }}"
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Siapkan berkas VoltKu.apk & baca SHA-1
        id: apk_info
        run: |
          mkdir -p dist-apk
          APK_FILE=$(find frontend/android/app/build/outputs/apk/debug -maxdepth 2 -name "*.apk" | head -n 1)
          test -n "$APK_FILE"
          cp "$APK_FILE" dist-apk/VoltKu.apk
          ls -lh dist-apk/VoltKu.apk
          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)
          SHA1=""
          if [ -n "$APKSIGNER" ]; then
            RAW_HEX=$("$APKSIGNER" verify --print-certs dist-apk/VoltKu.apk 2>/dev/null | sed -n 's/.*SHA-1 digest: \([0-9a-fA-F]\{40\}\).*/\1/p' | head -n 1)
            if [ -n "$RAW_HEX" ]; then
              SHA1=$(echo "$RAW_HEX" | tr '[:lower:]' '[:upper:]' | sed 's/../&:/g; s/:$//')
            fi
          fi
          if [ -z "$SHA1" ] && [ -f ~/.android/debug.keystore ]; then
            SHA1=$(keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android 2>/dev/null | awk -F': ' '/SHA1:/ {print $2; exit}')
          fi
          echo "sha1=$SHA1" >> "$GITHUB_OUTPUT"
          echo "APK Signing SHA-1: $SHA1"

      - name: Upload VoltKu.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoltKu.apk
          path: dist-apk/VoltKu.apk
          retention-days: 30

      - name: Publikasikan VoltKu.apk di GitHub Release (unduh langsung .apk)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="voltku-apk"
          NOTES="Build otomatis APK Android VoltKu dari GitHub Actions.\n\nVersi: \`1.0.${{ github.run_number }}\` (versionCode: \`${{ github.run_number }}\`)\nPackage: \`com.voltku.energy\`\nSigning SHA-1 (untuk Android OAuth Client Google Cloud): \`${{ steps.apk_info.outputs.sha1 }}\`"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-apk/VoltKu.apk --clobber
            gh release edit "$TAG" --notes "$(printf '%b' "$NOTES")"
          else
            gh release create "$TAG" dist-apk/VoltKu.apk \
              --title "VoltKu Android APK" \
              --notes "$(printf '%b' "$NOTES")"
          fi
