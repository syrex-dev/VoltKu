name: Build VoltKu Android APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'frontend/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Opsional: URL default server backend VoltKu untuk .apk (contoh: https://voltku.synemax.web.id)'
        required: false
        default: 'https://voltku.synemax.web.id'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java 21 (untuk Gradle & AGP 8.13)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies frontend
        working-directory: frontend
        run: npm ci

      - name: Lint & build frontend VoltKu
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ github.event.inputs.api_base_url || 'https://voltku.synemax.web.id' }}
        run: |
          npm run lint
          npm run build
          npx cap sync android

      - name: Beri izin eksekusi Gradle wrapper
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Debug APK (siap instal langsung di HP Android)
        working-directory: frontend/android
        run: ./gradlew assembleDebug

      - name: Upload VoltKu APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoltKu-android-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
