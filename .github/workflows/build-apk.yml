name: Build VoltKu Android APK

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'frontend/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Opsional: URL default server backend VoltKu untuk .apk (contoh: https://voltku.synemax.web.id)'
        required: false
        default: 'https://voltku.synemax.web.id'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java 21 (untuk Gradle & AGP 8.13)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle & Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Siapkan Android Debug Keystore persisten (agar SHA-1 Google Sign-In stabil)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: voltku-android-debug-keystore-v1

      - name: Pulihkan keystore dari Secret (opsional)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          fi

      - name: Install dependencies frontend
        working-directory: frontend
        run: npm ci

      - name: Lint & build frontend VoltKu
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ github.event.inputs.api_base_url || 'https://voltku.synemax.web.id' }}
        run: |
          npm run lint
          npm run build
          npx cap sync android

      - name: Beri izin eksekusi Gradle wrapper
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Debug APK (siap instal langsung di HP Android)
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Siapkan berkas VoltKu.apk & baca SHA-1
        id: apk_info
        run: |
          mkdir -p dist-apk
          APK_FILE=$(find frontend/android/app/build/outputs/apk/debug -maxdepth 2 -name "*.apk" | head -n 1)
          test -n "$APK_FILE"
          cp "$APK_FILE" dist-apk/VoltKu.apk
          ls -lh dist-apk/VoltKu.apk
          SHA1=$(keytool -printcert -jarfile dist-apk/VoltKu.apk | awk '/SHA1:/ {print $2; exit}')
          echo "sha1=$SHA1" >> "$GITHUB_OUTPUT"
          echo "APK Signing SHA-1: $SHA1"

      - name: Upload VoltKu.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoltKu.apk
          path: dist-apk/VoltKu.apk
          retention-days: 30

      - name: Publikasikan VoltKu.apk di GitHub Release (unduh langsung .apk)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="voltku-apk"
          NOTES="Build otomatis APK Android VoltKu dari GitHub Actions.\n\nPackage: \`com.voltku.energy\`\nSigning SHA-1 (untuk Android OAuth Client Google Cloud): \`${{ steps.apk_info.outputs.sha1 }}\`"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-apk/VoltKu.apk --clobber
            gh release edit "$TAG" --notes "$(printf '%b' "$NOTES")"
          else
            gh release create "$TAG" dist-apk/VoltKu.apk \
              --title "VoltKu Android APK" \
              --notes "$(printf '%b' "$NOTES")"
          fi
