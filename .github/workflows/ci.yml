name: VoltKu CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend Lint & Pytest
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: energy_monitor_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff anyio httpx

      - name: Run Ruff (repo-wide)
        working-directory: .
        run: ruff check .

      - name: Run Pytest
        env:
          APP_ENV: test
          DATABASE_URL: "mysql+pymysql://root@127.0.0.1:3306/energy_monitor_test?charset=utf8mb4"
          TEST_DATABASE_URL: "mysql+pymysql://root@127.0.0.1:3306/energy_monitor_test?charset=utf8mb4"
          JWT_SECRET: ci-test-jwt-secret-key-minimum-32-chars
          DASHBOARD_PASSWORD: ci-test-dashboard-password-123
        run: pytest -q

  frontend:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Oxlint
        run: npx oxlint src

      - name: Run Vitest
        run: npm test

      - name: Build production bundle
        run: npm run build
