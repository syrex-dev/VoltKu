services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: energy_mosquitto
    restart: unless-stopped
    # Port 1883 hanya di-bind ke loopback host agar tidak terbuka ke internet tanpa TLS.
    # Untuk perangkat ESP32 jarak jauh, aktifkan mosquitto-tls.conf & port 8883:8883.
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./passwd:/mosquitto/config/passwd:ro
      - ./acl:/mosquitto/config/acl:ro
      - ./certs:/mosquitto/certs:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: runtime
    container_name: energy_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - energy_data:/app/data
    env_file:
      - ../.env
    environment:
      - MQTT_HOST=mosquitto
    depends_on:
      - mosquitto

volumes:
  mosquitto_data:
  mosquitto_log:
  energy_data:

