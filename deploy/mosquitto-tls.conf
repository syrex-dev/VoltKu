# Konfigurasi Mosquitto Produksi dengan TLS (Port 8883 untuk ESP32 Publik + 1883 Internal Docker)
# Jalankan ./generate_mqtt_certs.sh terlebih dahulu sebelum me-mount file ini ke docker-compose.

per_listener_settings false

# Listener internal (hanya dapat diakses container dalam network Docker / loopback)
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Listener TLS eksternal untuk ESP32 melalui internet
listener 8883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
require_certificate false

persistence true
persistence_location /mosquitto/data/
log_dest stdout

