<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>VoltKu</title>

    <meta name="theme-color" id="app-theme-color" content="#ffffff" />
    <meta name="color-scheme" id="app-color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      id="apple-status-bar-style"
      content="default"
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'dark' || t === 'light') {
            document.documentElement.setAttribute('data-theme', t);
            document.documentElement.style.colorScheme = t;
            document.documentElement.style.backgroundColor = t === 'dark' ? '#0d1117' : '#f4f6f9';
            var tc = document.getElementById('app-theme-color');
            if (tc) tc.setAttribute('content', t === 'dark' ? '#0d1117' : '#ffffff');
            var cs = document.getElementById('app-color-scheme');
            if (cs) cs.setAttribute('content', t);
            var sb = document.getElementById('apple-status-bar-style');
            if (sb) sb.setAttribute('content', t === 'dark' ? 'black-translucent' : 'default');
          }
        } catch (e) {}
      })();
    </script>
    <meta name="apple-mobile-web-app-title" content="VoltKu" />
    <meta name="application-name" content="VoltKu" />

    <link rel="manifest" id="app-manifest-link" href="/manifest.webmanifest?v=3" />
    <script>
      if (window.location.pathname.indexOf('/admin') === 0) {
        var ml = document.getElementById('app-manifest-link');
        if (ml) ml.setAttribute('href', '/admin/manifest.webmanifest');
      }
    </script>
    <link rel="icon" href="/pwa-192.png?v=3" sizes="192x192" type="image/png" />
    <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
    <script type="module" crossorigin src="/assets/index-C9N0aI-V.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-g3CNpg6c.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (
        'serviceWorker' in navigator &&
        !(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())
      ) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js?v=3').catch(function () {});
        });
      }
    </script>
  </body>
</html>
