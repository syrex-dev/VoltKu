[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = 
    -std=gnu++17
    -I include
    -D CORE_DEBUG_LEVEL=0
lib_deps =
    mandulaj/PZEM-004T-v30@1.1.2
    mathieucarbou/AsyncTCP@3.3.2
    bertmelis/espMqttClient@1.7.0
    bblanchon/ArduinoJson@7.2.1

[env:voltku_v3_c3]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -std=gnu++17
    -I include
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D VOLTKU_V3_HARDWARE=1
    -D SENSOR_DRIVER_BL0942=1
    -D ENABLE_TFT_DISPLAY=1
    -D PAIRING_BUTTON_PIN=9
    -D STATUS_LED_PIN=21
lib_deps =
    mathieucarbou/AsyncTCP@3.3.2
    bertmelis/espMqttClient@1.7.0
    bblanchon/ArduinoJson@7.2.1
    lovyan03/LovyanGFX@^1.2.0
    ricmoo/QRCode@^0.0.1

[env:native]
platform = native
test_framework = unity
build_flags = 
    -std=c++17
