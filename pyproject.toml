[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "backend/tests", "."]
addopts = "-v"
markers = [
    "perf: performance benchmark tests",
]
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated.*:DeprecationWarning:starlette.testclient",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = []

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Security"]

[tool.ruff.lint.per-file-ignores]
"hardware/casing_3d/*.py" = ["E501"]
"scripts/generate_manual_pdf.py" = ["E501"]

[tool.pyrefly]
search-path = ["backend", "backend/tests", "."]
site-package-path = [".venv/Lib/site-packages"]
python-version = "3.11"

