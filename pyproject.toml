[tool.pytest.ini_options]
testpaths = ["backend/tests", "tests"]
pythonpath = ["backend", "."]
addopts = "-v"
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated.*:DeprecationWarning:starlette.testclient",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = []

